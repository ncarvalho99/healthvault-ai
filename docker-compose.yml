services:
  postgres:
    image: postgres:16-alpine
    container_name: healthvault_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-healthvault}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-healthvault_secret}
      POSTGRES_DB: ${DB_NAME:-healthvault}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-healthvault} -d ${DB_NAME:-healthvault}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healthvault_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-healthvault}:${DB_PASSWORD:-healthvault_secret}@postgres:5432/${DB_NAME:-healthvault}?schema=public
      JWT_SECRET: ${JWT_SECRET:-please_set_a_long_random_jwt_secret_in_env}
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - app_uploads:/app/uploads

volumes:
  postgres_data:
  app_uploads:
